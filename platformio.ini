; Firmware of the portable potentiostat (thesis, section 2.3). See README.md.
; Toolchain pinned so that the same source always gives the same binary:
;   PlatformIO Core 6.1, platform espressif32 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4).

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
upload_speed = 921600

monitor_speed = 115200
; the firmware echoes what is typed, so the monitor needs no local echo
monitor_eol = LF
; keep DTR/RTS low so that opening the monitor does not reset the board
monitor_dtr = 0
monitor_rts = 0

; OLED driver for standalone use (SH1106 / SSD1306), pinned
lib_deps =
    olikraus/U8g2@2.36.18

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
